# ============================================================
# Helm Chart Naming
# ============================================================
nameOverride: ""
fullnameOverride: ""
# ============================================================
# Employment Management Application
# ============================================================
replicaCount: 1
imageRepository: "vannalmanju/employment-management:1.0.0"
imageTag: "1.0.0"
imagePullPolicy: IfNotPresent
# ============================================================
# Service Account
# ============================================================
serviceAccount:
  create: true
  name: "employment-management"
# ============================================================
# Application Service
# ============================================================
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

applicationPort: 8080
# ============================================================
# Application Resources
# ============================================================
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
# ============================================================
# Readiness Probe
# ============================================================
readinessProbe:
  enabled: true
  path: "/actuator/health/readiness"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# ============================================================
# Liveness Probe
# ============================================================

livenessProbe:
  enabled: true
  path: "/actuator/health/liveness"
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# ============================================================
# Application Ingress - AWS ALB
# ============================================================
ingress:
  enabled: true
  className: "alb"
  host: "cloudaiops.site"
  path: "/app"
  pathType: Prefix
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/group.name: "cloudaiops-public"
    alb.ingress.kubernetes.io/group.order: "10"

  tls:
    enabled: true
    certificateArn: ""
# ============================================================
# Horizontal Pod Autoscaler
# ============================================================
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# ============================================================
# Pod Security Context
# ============================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
# ============================================================
# Container Security Context
# ============================================================
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
# ============================================================
# Scheduling
# ============================================================
nodeSelector: {}
tolerations: []
affinity: {}
# ============================================================
# PostgreSQL
# ============================================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  database: studentdb
  username: postgres
  password: postgres
  port: 5432
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: gp3
    accessMode: ReadWriteOnce
    size: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6