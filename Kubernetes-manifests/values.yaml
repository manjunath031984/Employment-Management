app:
  replicaCount: 1

  image:
    repository: us-central1-docker.pkg.dev/gcp-dev-july-2026/employment-management/employment-management
    tag: "1.0.7"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceAccount:
  create: true
  name: employment-management-sa

postgres:
  replicaCount: 1

  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent

  dbName: employee-managementdb
  user: postgres
  password: postgres
  port: 5432

  storage:
    className: standard-rwo
    size: 5Gi

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

gateway:
  enabled: true
  className: gke-l7-global-external-managed
  ipName: cloudaiops-gateway-ip
  tlsSecretName: cloudaiops-tls
  tlsPasswordBase64: cG9zdGdyZXM=
  hostname: cloudaiops.site
  createClass: false

rbac:
  create: true

argocd:
  rbac:
    create: true
    serviceAccountName: argocd-deployer-sa
    controllerServiceAccountName: argocd-application-controller
    clusterRoleName: employment-management-argocd-deployer
    clusterRoleBindingName: employment-management-argocd-deployer