{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: employment-management-rolebinding
  namespace: stateful-demo
  labels:
    app.kubernetes.io/name: employment-management
    app.kubernetes.io/managed-by: Helm
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: stateful-demo
roleRef:
  kind: Role
  name: employment-management-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}