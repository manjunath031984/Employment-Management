name: Employment Management CI

on:
  push:
    branches:
      - feature/Employment-Management
      - feature/github-actions-ci
      - main

  pull_request:
    branches:
      - feature/Employment-Management
      - main

permissions:
  contents: read

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs: build-test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -t employment-management:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect employment-management:${{ github.sha }}